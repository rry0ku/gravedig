rules:
  - id: aws-access-key-id
    name: AWS Access Key ID
    regex: '\b(?:AKIA|ABIA|ACCA|ASIA)[0-9A-Z]{16}\b'
    keywords:
      - AKIA
      - ABIA
      - ACCA
      - ASIA
    entropyThreshold: 0.0
    severity: CRITICAL
    description: Identified an Amazon Web Services Access Key ID.
    remediation: Revoke the key in AWS IAM and generate a new key pair.

  - id: aws-secret-access-key
    name: AWS Secret Access Key
    regex: '(?i)(?:aws_secret_access_key|aws_secret|aws_key)\s*[:=]\s*["'']?([A-Za-z0-9\/+=]{40})["'']?'
    keywords:
      - aws_secret_access_key
      - aws_secret
      - aws_key
    entropyThreshold: 0.0
    severity: CRITICAL
    description: Identified an Amazon Web Services Secret Access Key assignment.
    remediation: Invalidate the secret immediately via AWS IAM and rotate credentials.

  - id: github-pat
    name: GitHub Personal Access Token
    regex: '\b(?:ghp_[a-zA-Z0-9]{36}|gho_[a-zA-Z0-9]{36}|ghu_[a-zA-Z0-9]{36}|ghs_[a-zA-Z0-9]{36}|github_pat_[a-zA-Z0-9]{22}_[a-zA-Z0-9]{59})\b'
    keywords:
      - ghp_
      - gho_
      - ghu_
      - ghs_
      - github_pat_
    entropyThreshold: 0.0
    severity: CRITICAL
    description: Identified a GitHub Personal Access Token (classic or fine-grained).
    remediation: Revoke the token at GitHub Settings -> Developer settings -> Personal access tokens.

  - id: gitlab-pat
    name: GitLab Personal Access Token
    regex: '\bglpat-[a-zA-Z0-9\-_]{20,22}\b'
    keywords:
      - glpat-
    entropyThreshold: 0.0
    severity: CRITICAL
    description: Identified a GitLab Personal Access Token.
    remediation: Revoke this token in GitLab User Settings -> Access Tokens.

  - id: slack-token
    name: Slack Token
    regex: '\bxox[bpar]-[0-9]{10,13}-[0-9]{10,13}[a-zA-Z0-9-]*\b'
    keywords:
      - xoxb-
      - xoxp-
      - xoxa-
      - xoxr-
    entropyThreshold: 0.0
    severity: HIGH
    description: Identified a Slack bot, user, or app-level API token.
    remediation: Revoke the token in your Slack API App configuration page.

  - id: slack-webhook
    name: Slack Incoming Webhook
    regex: 'https:\/\/hooks\.slack\.com\/services\/T[a-zA-Z0-9_]{8,12}\/B[a-zA-Z0-9_]{8,12}\/[a-zA-Z0-9_]{24}'
    keywords:
      - hooks.slack.com
    entropyThreshold: 0.0
    severity: HIGH
    description: Identified a Slack Incoming Webhook URL.
    remediation: Invalidate and remove the incoming webhook integration in Slack.

  - id: stripe-secret-key
    name: Stripe Secret Key
    regex: '\b[sr]k_live_[0-9a-zA-Z]{24,99}\b'
    keywords:
      - sk_live_
      - rk_live_
    entropyThreshold: 0.0
    severity: CRITICAL
    description: Identified a live Stripe secret key or restricted API key.
    remediation: Roll the secret key immediately in the Stripe Dashboard Developers -> API keys.

  - id: twilio-api-key
    name: Twilio API Key
    regex: '\bSK[0-9a-fA-F]{32}\b'
    keywords:
      - SK
    entropyThreshold: 0.0
    severity: HIGH
    description: Identified a Twilio API Key SID/Secret.
    remediation: Revoke the API key in the Twilio Console and issue a new one.

  - id: sendgrid-api-key
    name: SendGrid API Key
    regex: '\bSG\.[a-zA-Z0-9_-]{22}\.[a-zA-Z0-9_-]{43}\b'
    keywords:
      - SG.
    entropyThreshold: 0.0
    severity: HIGH
    description: Identified a SendGrid API Key.
    remediation: Revoke the API key in Twilio SendGrid Settings -> API Keys.

  - id: npm-access-token
    name: npm Access Token
    regex: '\bnpm_[a-zA-Z0-9]{36}\b'
    keywords:
      - npm_
    entropyThreshold: 0.0
    severity: HIGH
    description: Identified an npm access token.
    remediation: Revoke the token using `npm token revoke <token>` or on npmjs.com.

  - id: pypi-api-token
    name: PyPI API Token
    regex: '\bpypi-AgEIcHlwaS5vcmc[A-Za-z0-9_-]{50,}\b'
    keywords:
      - pypi-
    entropyThreshold: 0.0
    severity: HIGH
    description: Identified a PyPI upload or project API token.
    remediation: Revoke the token in PyPI Account settings -> API tokens.

  - id: jwt-token
    name: JSON Web Token (JWT)
    regex: '\beyJ[A-Za-z0-9_-]{10,}\.eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\b'
    keywords:
      - eyJ
    entropyThreshold: 0.0
    severity: MEDIUM
    description: Identified a signed JSON Web Token (JWT).
    remediation: Inspect token claims and invalidate active sessions or signing secrets if compromised.

  - id: private-key-header
    name: Private Key Header
    regex: '-----BEGIN (?:RSA |EC |OPENSSH |DSA |PGP )?PRIVATE KEY(?: BLOCK)?-----'
    keywords:
      - BEGIN
      - PRIVATE KEY
    entropyThreshold: 0.0
    severity: CRITICAL
    description: Identified an unencrypted private cryptographic key block.
    remediation: Immediately rotate the key pair and revoke any public certificates or authorizations.

  - id: db-connection-url
    name: Database Connection URL with Password
    regex: '\b(?:postgres|postgresql|mysql|mongodb|redis|amqp|mariadb):\/\/[^\s:@/]+:[^\s:@/]+@[^\s/:]+'
    keywords:
      - '://'
    entropyThreshold: 0.0
    severity: CRITICAL
    description: Identified a database connection string containing embedded plaintext credentials.
    remediation: Change the database user password immediately and use secrets manager / environment variables.

  - id: generic-secret-assignment
    name: Generic Password or Secret Assignment
    regex: '(?i)\b(?:password|passwd|pwd|secret|api_key|apikey|access_token|auth_token)\s*[:=]\s*["'']([^"''\s]{8,})["'']'
    keywords:
      - password
      - passwd
      - pwd
      - secret
      - api_key
      - apikey
      - token
    entropyThreshold: 0.0
    severity: MEDIUM
    description: Identified a potential hardcoded password or credential assignment.
    remediation: Remove hardcoded credential and replace with environment variable or secret manager lookup.

  - id: openai-api-key
    name: OpenAI API Key
    regex: '\b(?:sk-[a-zA-Z0-9]{48}|sk-proj-[a-zA-Z0-9_\-]{48,128}|sk-admin-[a-zA-Z0-9_\-]{48,128})\b'
    keywords:
      - sk-
      - sk-proj-
      - sk-admin-
    entropyThreshold: 0.0
    severity: CRITICAL
    description: Identified an OpenAI API key or project service account key.
    remediation: Revoke the key immediately in the OpenAI Platform Dashboard under API Keys.

  - id: anthropic-api-key
    name: Anthropic Claude API Key
    regex: '\bsk-ant-api03-[a-zA-Z0-9_\-]{90,110}\b'
    keywords:
      - sk-ant-api03-
    entropyThreshold: 0.0
    severity: CRITICAL
    description: Identified an Anthropic Claude API key.
    remediation: Revoke the key in the Anthropic Console under API Keys.

  - id: google-api-key
    name: Google API Key / Gemini Key
    regex: '\bAIza[0-9A-Za-z\-_]{35}\b'
    keywords:
      - AIza
    entropyThreshold: 0.0
    severity: HIGH
    description: Identified a Google Cloud / Google AI / Gemini API key.
    remediation: Revoke the key in Google Cloud Console -> APIs & Services -> Credentials.

  - id: huggingface-token
    name: Hugging Face Access Token
    regex: '\bhf_[a-zA-Z0-9]{34,37}\b'
    keywords:
      - hf_
    entropyThreshold: 0.0
    severity: HIGH
    description: Identified a Hugging Face user access or fine-tuning token.
    remediation: Revoke the token in Hugging Face Settings -> Access Tokens.

  - id: cohere-api-key
    name: Cohere API Key
    regex: '(?i)(?:cohere_api_key|cohere_key|cohere_secret)\s*[:=]\s*["'']?([a-zA-Z0-9]{40})["'']?'
    keywords:
      - cohere_api_key
      - cohere_key
    entropyThreshold: 0.0
    severity: HIGH
    description: Identified a Cohere LLM API key.
    remediation: Invalidate and regenerate key in Cohere Dashboard.

  - id: discord-bot-token
    name: Discord Bot Token
    regex: '\b[MN][A-Za-z\d]{23,26}\.[A-Za-z\d\-_]{6}\.[A-Za-z\d\-_]{27,38}\b'
    keywords: []
    entropyThreshold: 0.0
    severity: CRITICAL
    description: Identified a Discord Bot Token allowing bot control and message access.
    remediation: Reset the bot token immediately in the Discord Developer Portal.

  - id: discord-webhook
    name: Discord Webhook URL
    regex: 'https:\/\/discord(?:app)?\.com\/api\/webhooks\/[0-9]{17,20}\/[A-Za-z0-9_\-]{60,68}'
    keywords:
      - discord.com/api/webhooks
      - discordapp.com/api/webhooks
    entropyThreshold: 0.0
    severity: HIGH
    description: Identified a Discord Webhook endpoint URL.
    remediation: Delete and regenerate the webhook in Discord Server Settings -> Integrations.

  - id: telegram-bot-token
    name: Telegram Bot Token
    regex: '\b[0-9]{8,10}:[a-zA-Z0-9_\-]{35}\b'
    keywords: []
    entropyThreshold: 0.0
    severity: HIGH
    description: Identified a Telegram Bot API authorization token.
    remediation: Revoke and regenerate the token via @BotFather in Telegram.

  - id: github-oauth-token
    name: GitHub OAuth Access Token
    regex: '\b(?:gho_[a-zA-Z0-9]{36}|ghu_[a-zA-Z0-9]{36}|ghs_[a-zA-Z0-9]{36}|ghr_[a-zA-Z0-9]{36})\b'
    keywords:
      - gho_
      - ghu_
      - ghs_
      - ghr_
    entropyThreshold: 0.0
    severity: CRITICAL
    description: Identified a GitHub OAuth app token, user-to-server token, or server-to-server token.
    remediation: Invalidate token via GitHub Developer Settings.

  - id: azure-storage-account-key
    name: Azure Storage Account Key
    regex: '(?i)(?:AccountKey|DefaultEndpointsProtocol=[^;]+;AccountName=[^;]+;AccountKey)=([a-zA-Z0-9+/=]{86,90})'
    keywords:
      - AccountKey=
    entropyThreshold: 0.0
    severity: CRITICAL
    description: Identified an Azure Storage Account connection key.
    remediation: Regenerate key1/key2 in the Azure Portal under Storage Accounts -> Access keys.

  - id: gcp-service-account-json
    name: GCP Service Account Private Key
    regex: '"type":\s*"service_account",\s*"project_id":'
    keywords:
      - service_account
      - project_id
    entropyThreshold: 0.0
    severity: CRITICAL
    description: Identified an exported Google Cloud Service Account credentials JSON file.
    remediation: Delete the compromised service account key in Google Cloud Console IAM -> Service Accounts.

  - id: square-access-token
    name: Square Access Token
    regex: '\b(?:sq0atp-[0-9A-Za-z\-_]{22}|EAAA[a-zA-Z0-9_\-]{60})\b'
    keywords:
      - sq0atp-
      - EAAA
    entropyThreshold: 0.0
    severity: CRITICAL
    description: Identified a Square Production Access Token.
    remediation: Revoke token in Square Developer Dashboard -> Credentials.

  - id: shopify-access-token
    name: Shopify Admin API Token
    regex: '\b(?:shpat_[a-fA-F0-9]{32}|shpca_[a-fA-F0-9]{32}|shppa_[a-fA-F0-9]{32})\b'
    keywords:
      - shpat_
      - shpca_
      - shppa_
    entropyThreshold: 0.0
    severity: CRITICAL
    description: Identified a Shopify Admin or Custom App API access token.
    remediation: Revoke app credentials in Shopify Partner Dashboard / Admin Apps.

  - id: postman-api-key
    name: Postman API Key
    regex: '\bPMAK-[a-f0-9]{24}-[a-f0-9]{34}\b'
    keywords:
      - PMAK-
    entropyThreshold: 0.0
    severity: HIGH
    description: Identified a Postman Personal Access Key.
    remediation: Revoke the API key in Postman Settings -> API Keys.

  - id: datadog-api-key
    name: Datadog API / App Key
    regex: '(?i)(?:datadog_api_key|datadog_app_key|dd_api_key|dd_app_key)\s*[:=]\s*["'']?([a-f0-9]{32,40})["'']?'
    keywords:
      - datadog_api_key
      - datadog_app_key
      - dd_api_key
    entropyThreshold: 0.0
    severity: HIGH
    description: Identified a Datadog API or Application Key.
    remediation: Revoke the key in Datadog Organization Settings -> API Keys.

  - id: sentry-auth-token
    name: Sentry Auth Token
    regex: '\bsntrys_[a-zA-Z0-9]{64}\b'
    keywords:
      - sntrys_
    entropyThreshold: 0.0
    severity: HIGH
    description: Identified a Sentry User or Internal Integration Auth Token.
    remediation: Revoke the token in Sentry Settings -> Developer Settings / Auth Tokens.

  - id: cloudflare-api-token
    name: Cloudflare API Token
    regex: '(?i)(?:cloudflare_api_token|cloudflare_token|cf_api_key|cf_token)\s*[:=]\s*["'']?([a-zA-Z0-9_\-]{40})["'']?'
    keywords:
      - cloudflare_api_token
      - cf_api_key
      - cloudflare_token
    entropyThreshold: 0.0
    severity: CRITICAL
    description: Identified a Cloudflare Global API Key or scoped API Token.
    remediation: Roll API Token in Cloudflare Dashboard -> My Profile -> API Tokens.

  - id: hashicorp-vault-token
    name: HashiCorp Vault Token
    regex: '\b(?:hvs\.[a-zA-Z0-9_\-]{90,105}|s\.[a-zA-Z0-9]{24,32})\b'
    keywords:
      - hvs.
      - s.
    entropyThreshold: 0.0
    severity: CRITICAL
    description: Identified a HashiCorp Vault root or service token.
    remediation: Revoke the token using `vault token revoke <token>`.

  - id: mailgun-api-key
    name: Mailgun Private API Key
    regex: '\bkey-[0-9a-zA-Z]{32}\b'
    keywords:
      - key-
    entropyThreshold: 0.0
    severity: HIGH
    description: Identified a Mailgun Private API Key.
    remediation: Rotate the API key in Mailgun Dashboard -> Settings -> API Keys.

  - id: linear-api-key
    name: Linear API Key
    regex: '\blin_api_[a-zA-Z0-9]{40}\b'
    keywords:
      - lin_api_
    entropyThreshold: 0.0
    severity: HIGH
    description: Identified a Linear Personal API Key.
    remediation: Revoke key in Linear Account Settings -> Security & API.

  - id: supabase-service-role-key
    name: Supabase Service Role Key
    regex: '\beyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\.eyJpc3MiOiJzdXBhYmFzZSIs(?:[a-zA-Z0-9_\-\.]*)\b'
    keywords:
      - eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS
    entropyThreshold: 0.0
    severity: CRITICAL
    description: Identified a Supabase Service Role Key (bypasses Row Level Security).
    remediation: Invalidate and regenerate project API keys in Supabase Settings -> API.

  - id: resend-api-key
    name: Resend API Key
    regex: '\bre_[a-zA-Z0-9]{24,32}\b'
    keywords:
      - re_
    entropyThreshold: 0.0
    severity: HIGH
    description: Identified a Resend transactional email API key.
    remediation: Revoke key in Resend Dashboard -> API Keys.

  - id: terraform-cloud-token
    name: Terraform Cloud / Atlas API Token
    regex: '\b[a-zA-Z0-9]{14}\.atlasv1\.[a-zA-Z0-9_\-]{60,70}\b'
    keywords:
      - .atlasv1.
    entropyThreshold: 0.0
    severity: CRITICAL
    description: Identified a HashiCorp Terraform Cloud / Enterprise User Token.
    remediation: Revoke token in Terraform Cloud User Settings -> Tokens.

  - id: digitalocean-pat
    name: DigitalOcean Personal Access Token
    regex: '\bdop_v1_[a-f0-9]{64}\b'
    keywords:
      - dop_v1_
    entropyThreshold: 0.0
    severity: CRITICAL
    description: Identified a DigitalOcean Personal Access Token.
    remediation: Delete the token in DigitalOcean Control Panel -> API -> Tokens/Keys.

  - id: grafana-service-account-token
    name: Grafana Service Account Token
    regex: '\bglsa_[A-Za-z0-9]{32}_[A-Za-z0-9]{8}\b'
    keywords:
      - glsa_
    entropyThreshold: 0.0
    severity: HIGH
    description: Identified a Grafana Service Account Token.
    remediation: Delete the service account token in Grafana Administration -> Service Accounts.

